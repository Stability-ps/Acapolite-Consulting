name: Validate Capacitor Native Shell

on:
  push:
    branches:
      - mobile/capacitor-shell
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-shell:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install

      - name: Run unit tests
        run: npm test -- --run

      - name: Build mobile web bundle
        run: npm run build -- --mode mobile

      - name: Generate iOS project
        working-directory: mobile
        run: npx cap add ios

      - name: Generate Android project
        working-directory: mobile
        run: npx cap add android

      - name: Sync Capacitor projects
        working-directory: mobile
        run: npx cap sync

      - name: Verify generated bundle identifiers
        run: |
          grep -R "za.co.acapoliteconsulting.app" mobile/ios mobile/android

      - name: Archive generated native projects
        run: tar -czf acapolite-native-projects.tar.gz mobile/ios mobile/android

      - name: Upload native projects artifact
        uses: actions/upload-artifact@v4
        with:
          name: acapolite-native-projects
          path: acapolite-native-projects.tar.gz
          retention-days: 7
